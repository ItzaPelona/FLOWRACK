<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Management - FlowRack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h1>FlowRack - Suppliers</h1>
        </div>
        <div class="nav-user">
            <span id="userName">Loading...</span>
            <button id="logoutBtn" class="btn-secondary">Logout</button>
        </div>
    </nav>

    <div class="container">
        <!-- Action Bar -->
        <div class="action-bar">
            <button id="addSupplierBtn" class="btn-primary">
                <span class="icon">➕</span> Add Supplier
            </button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search suppliers...">
                <button id="searchBtn" class="btn-primary">Search</button>
            </div>
            <div class="filter-group">
                <label>
                    <input type="checkbox" id="activeOnly" checked> Active Only
                </label>
            </div>
            <button id="backBtn" class="btn-secondary">
                <span class="icon">←</span> Back
            </button>
        </div>

        <!-- Suppliers Grid -->
        <div class="suppliers-grid" id="suppliersGrid">
            <div class="loading">Loading suppliers...</div>
        </div>
    </div>

    <!-- Add/Edit Supplier Modal -->
    <div id="supplierModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Supplier</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="supplierForm">
                    <input type="hidden" id="supplierId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="supplierName">Company Name *</label>
                            <input type="text" id="supplierName" required>
                        </div>
                        <div class="form-group">
                            <label for="supplierContact">Contact Person</label>
                            <input type="text" id="supplierContact">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="supplierEmail">Email *</label>
                            <input type="email" id="supplierEmail" required>
                        </div>
                        <div class="form-group">
                            <label for="supplierPhone">Phone *</label>
                            <input type="tel" id="supplierPhone" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="supplierAddress">Address</label>
                        <textarea id="supplierAddress" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="supplierWebsite">Website</label>
                        <input type="url" id="supplierWebsite" placeholder="https://...">
                    </div>

                    <div class="form-group">
                        <label for="supplierNotes">Notes</label>
                        <textarea id="supplierNotes" rows="3" 
                                  placeholder="Payment terms, delivery info, etc."></textarea>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="supplierActive" checked>
                            Active Supplier
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="submitBtn">Save Supplier</button>
                        <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Supplier Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content large-modal">
            <div class="modal-header">
                <h2 id="detailsTitle">Supplier Details</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div id="supplierDetails"></div>
                
                <div class="modal-section">
                    <h3>Associated Products</h3>
                    <button id="linkProductBtn" class="btn-primary">
                        <span class="icon">🔗</span> Link Product
                    </button>
                    <div id="associatedProducts"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Link Product Modal -->
    <div id="linkProductModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Link Product to Supplier</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="linkProductForm">
                    <input type="hidden" id="linkSupplierId">
                    
                    <div class="form-group">
                        <label for="linkProduct">Product *</label>
                        <select id="linkProduct" required>
                            <option value="">Select product...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="linkSupplierCode">Supplier Product Code</label>
                        <input type="text" id="linkSupplierCode" 
                               placeholder="Supplier's internal product code">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="linkCostPrice">Cost Price *</label>
                            <input type="number" id="linkCostPrice" step="0.01" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="linkLeadTime">Lead Time (days)</label>
                            <input type="number" id="linkLeadTime" min="0" value="7">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="linkMinOrder">Minimum Order Quantity</label>
                        <input type="number" id="linkMinOrder" step="0.01" min="0" value="1">
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="linkPreferred">
                            Set as Preferred Supplier for this product
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Link Product</button>
                        <button type="button" class="btn-secondary" id="cancelLinkBtn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/utils.js"></script>
    <script>
        // Check authentication
        const token = localStorage.getItem('flowrack_token');
        if (!token) {
            window.location.href = '/';
        }

        const user = JSON.parse(localStorage.getItem('flowrack_user') || '{}');
        if (user.first_name && user.last_name) {
            document.getElementById('userName').textContent = user.first_name + ' ' + user.last_name;
        }

        // Check admin/operator permissions
        if (!['admin', 'operator'].includes(user.role)) {
            showError('You do not have permission to access supplier management');
            setTimeout(() => window.location.href = 'products.html', 2000);
        }

        // State
        let suppliers = [];
        let allProducts = [];
        let currentSupplier = null;

        // Load initial data
        loadSuppliers();
        loadProducts();

        // Event Listeners
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('addSupplierBtn').addEventListener('click', () => openSupplierModal());
        document.getElementById('backBtn').addEventListener('click', () => window.location.href = 'products.html');
        document.getElementById('searchBtn').addEventListener('click', searchSuppliers);
        document.getElementById('activeOnly').addEventListener('change', loadSuppliers);
        document.getElementById('supplierForm').addEventListener('submit', saveSupplier);
        document.getElementById('cancelBtn').addEventListener('click', closeSupplierModal);
        document.getElementById('linkProductForm').addEventListener('submit', linkProduct);
        document.getElementById('cancelLinkBtn').addEventListener('click', closeLinkProductModal);

        // Search on Enter
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchSuppliers();
        });

        // Close modals
        document.querySelectorAll('.modal .close').forEach(closeBtn => {
            closeBtn.addEventListener('click', function() {
                this.closest('.modal').style.display = 'none';
            });
        });

        window.addEventListener('click', function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        });

        // Functions
        async function loadSuppliers() {
            try {
                const activeOnly = document.getElementById('activeOnly').checked;
                const search = document.getElementById('searchInput').value;
                
                const params = new URLSearchParams();
                if (search) params.append('search', search);
                if (activeOnly) params.append('active', 'true');

                const response = await apiRequest(`/api/suppliers?${params}`);
                suppliers = response.suppliers;
                displaySuppliers();
            } catch (error) {
                showError('Failed to load suppliers: ' + error.message);
                document.getElementById('suppliersGrid').innerHTML =
                    `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function loadProducts() {
            try {
                const response = await apiRequest('/api/products');
                allProducts = response.products;
                
                const select = document.getElementById('linkProduct');
                select.innerHTML = '<option value="">Select product...</option>';
                allProducts.forEach(product => {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = `${product.name} (${product.product_code})`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load products:', error);
            }
        }

        function displaySuppliers() {
            const grid = document.getElementById('suppliersGrid');
            
            if (!suppliers || suppliers.length === 0) {
                grid.innerHTML = '<div class="empty-state">No suppliers found</div>';
                return;
            }

            grid.innerHTML = suppliers.map(supplier => `
                <div class="supplier-card ${!supplier.is_active ? 'inactive' : ''}">
                    <div class="supplier-header">
                        <h3>${supplier.name}</h3>
                        ${!supplier.is_active ? '<span class="badge badge-inactive">Inactive</span>' : ''}
                    </div>
                    <div class="supplier-info">
                        ${supplier.contact_person ? `<p><strong>Contact:</strong> ${supplier.contact_person}</p>` : ''}
                        <p><strong>Email:</strong> <a href="mailto:${supplier.email}">${supplier.email}</a></p>
                        <p><strong>Phone:</strong> <a href="tel:${supplier.phone}">${supplier.phone}</a></p>
                        ${supplier.website ? `<p><strong>Website:</strong> <a href="${supplier.website}" target="_blank">Visit</a></p>` : ''}
                        ${supplier.address ? `<p><strong>Address:</strong> ${truncate(supplier.address, 50)}</p>` : ''}
                    </div>
                    <div class="supplier-actions">
                        <button class="btn-small btn-primary" onclick="viewSupplierDetails(${supplier.id})">
                            View Details
                        </button>
                        <button class="btn-small" onclick="openSupplierModal(${supplier.id})">
                            Edit
                        </button>
                        ${supplier.is_active ? `
                            <button class="btn-small btn-danger" onclick="deleteSupplier(${supplier.id})">
                                Deactivate
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function searchSuppliers() {
            loadSuppliers();
        }

        function openSupplierModal(supplierId = null) {
            const modal = document.getElementById('supplierModal');
            const form = document.getElementById('supplierForm');
            
            form.reset();
            document.getElementById('supplierId').value = '';
            document.getElementById('modalTitle').textContent = 'Add Supplier';
            
            if (supplierId) {
                const supplier = suppliers.find(s => s.id === supplierId);
                if (supplier) {
                    document.getElementById('modalTitle').textContent = 'Edit Supplier';
                    document.getElementById('supplierId').value = supplier.id;
                    document.getElementById('supplierName').value = supplier.name;
                    document.getElementById('supplierContact').value = supplier.contact_person || '';
                    document.getElementById('supplierEmail').value = supplier.email;
                    document.getElementById('supplierPhone').value = supplier.phone;
                    document.getElementById('supplierAddress').value = supplier.address || '';
                    document.getElementById('supplierWebsite').value = supplier.website || '';
                    document.getElementById('supplierNotes').value = supplier.notes || '';
                    document.getElementById('supplierActive').checked = supplier.is_active;
                }
            }
            
            modal.style.display = 'block';
        }

        function closeSupplierModal() {
            document.getElementById('supplierModal').style.display = 'none';
        }

        async function saveSupplier(e) {
            e.preventDefault();
            
            const supplierId = document.getElementById('supplierId').value;
            const data = {
                name: document.getElementById('supplierName').value,
                contact_person: document.getElementById('supplierContact').value || null,
                email: document.getElementById('supplierEmail').value,
                phone: document.getElementById('supplierPhone').value,
                address: document.getElementById('supplierAddress').value || null,
                website: document.getElementById('supplierWebsite').value || null,
                notes: document.getElementById('supplierNotes').value || null,
                is_active: document.getElementById('supplierActive').checked
            };

            try {
                if (supplierId) {
                    await apiRequest(`/api/suppliers/${supplierId}`, {
                        method: 'PUT',
                        body: JSON.stringify(data)
                    });
                    showSuccess('Supplier updated successfully!');
                } else {
                    await apiRequest('/api/suppliers', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    showSuccess('Supplier added successfully!');
                }
                
                closeSupplierModal();
                loadSuppliers();
            } catch (error) {
                showError('Failed to save supplier: ' + error.message);
            }
        }

        async function viewSupplierDetails(supplierId) {
            try {
                const supplier = await apiRequest(`/api/suppliers/${supplierId}`);
                currentSupplier = supplier;
                
                const details = `
                    <div class="details-grid">
                        <div class="detail-item">
                            <strong>Company Name:</strong> ${supplier.name}
                        </div>
                        <div class="detail-item">
                            <strong>Status:</strong> 
                            <span class="badge ${supplier.is_active ? 'badge-success' : 'badge-inactive'}">
                                ${supplier.is_active ? 'Active' : 'Inactive'}
                            </span>
                        </div>
                        ${supplier.contact_person ? `
                            <div class="detail-item">
                                <strong>Contact Person:</strong> ${supplier.contact_person}
                            </div>
                        ` : ''}
                        <div class="detail-item">
                            <strong>Email:</strong> <a href="mailto:${supplier.email}">${supplier.email}</a>
                        </div>
                        <div class="detail-item">
                            <strong>Phone:</strong> <a href="tel:${supplier.phone}">${supplier.phone}</a>
                        </div>
                        ${supplier.website ? `
                            <div class="detail-item">
                                <strong>Website:</strong> <a href="${supplier.website}" target="_blank">${supplier.website}</a>
                            </div>
                        ` : ''}
                        ${supplier.address ? `
                            <div class="detail-item full-width">
                                <strong>Address:</strong><br>${supplier.address}
                            </div>
                        ` : ''}
                        ${supplier.notes ? `
                            <div class="detail-item full-width">
                                <strong>Notes:</strong><br>${supplier.notes}
                            </div>
                        ` : ''}
                        <div class="detail-item">
                            <strong>Added:</strong> ${formatDate(supplier.created_at)}
                        </div>
                        ${supplier.updated_at ? `
                            <div class="detail-item">
                                <strong>Last Updated:</strong> ${formatDate(supplier.updated_at)}
                            </div>
                        ` : ''}
                    </div>
                `;
                
                document.getElementById('detailsTitle').textContent = supplier.name;
                document.getElementById('supplierDetails').innerHTML = details;
                
                // Display associated products
                displayAssociatedProducts(supplier.products || []);
                
                // Setup link product button
                document.getElementById('linkProductBtn').onclick = () => openLinkProductModal(supplier.id);
                
                document.getElementById('detailsModal').style.display = 'block';
            } catch (error) {
                showError('Failed to load supplier details: ' + error.message);
            }
        }

        function displayAssociatedProducts(products) {
            const container = document.getElementById('associatedProducts');
            
            if (!products || products.length === 0) {
                container.innerHTML = '<p class="empty-state">No products linked to this supplier</p>';
                return;
            }

            container.innerHTML = `
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Supplier Code</th>
                            <th>Cost Price</th>
                            <th>Lead Time</th>
                            <th>Min Order</th>
                            <th>Preferred</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${products.map(p => `
                            <tr>
                                <td>${p.product_name}</td>
                                <td>${p.supplier_product_code || '-'}</td>
                                <td>$${p.cost_price ? p.cost_price.toFixed(2) : '0.00'}</td>
                                <td>${p.lead_time_days || 0} days</td>
                                <td>${p.minimum_order_quantity || 1}</td>
                                <td>${p.is_preferred ? '⭐' : ''}</td>
                                <td>
                                    <button class="btn-small btn-danger" 
                                            onclick="unlinkProduct(${currentSupplier.id}, ${p.product_id})">
                                        Unlink
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function openLinkProductModal(supplierId) {
            document.getElementById('linkSupplierId').value = supplierId;
            document.getElementById('linkProductForm').reset();
            document.getElementById('linkProductModal').style.display = 'block';
        }

        function closeLinkProductModal() {
            document.getElementById('linkProductModal').style.display = 'none';
        }

        async function linkProduct(e) {
            e.preventDefault();
            
            const supplierId = document.getElementById('linkSupplierId').value;
            const data = {
                product_id: parseInt(document.getElementById('linkProduct').value),
                supplier_product_code: document.getElementById('linkSupplierCode').value || null,
                cost_price: parseFloat(document.getElementById('linkCostPrice').value),
                lead_time_days: parseInt(document.getElementById('linkLeadTime').value) || 0,
                minimum_order_quantity: parseFloat(document.getElementById('linkMinOrder').value) || 1,
                is_preferred: document.getElementById('linkPreferred').checked
            };

            try {
                await apiRequest(`/api/suppliers/${supplierId}/products`, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                showSuccess('Product linked successfully!');
                closeLinkProductModal();
                
                // Reload supplier details
                viewSupplierDetails(parseInt(supplierId));
            } catch (error) {
                showError('Failed to link product: ' + error.message);
            }
        }

        async function unlinkProduct(supplierId, productId) {
            if (!confirm('Are you sure you want to unlink this product from the supplier?')) {
                return;
            }

            try {
                await apiRequest(`/api/suppliers/${supplierId}/products/${productId}`, {
                    method: 'DELETE'
                });
                
                showSuccess('Product unlinked successfully!');
                viewSupplierDetails(supplierId);
            } catch (error) {
                showError('Failed to unlink product: ' + error.message);
            }
        }

        async function deleteSupplier(supplierId) {
            if (!confirm('Are you sure you want to deactivate this supplier?')) {
                return;
            }

            try {
                await apiRequest(`/api/suppliers/${supplierId}`, {
                    method: 'DELETE'
                });
                
                showSuccess('Supplier deactivated successfully!');
                loadSuppliers();
            } catch (error) {
                showError('Failed to deactivate supplier: ' + error.message);
            }
        }

        // Utility functions for showing messages
        function showError(message) {
            alert('Error: ' + message);
        }

        function showSuccess(message) {
            alert('Success: ' + message);
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = '/';
        });
    </script>

    <!-- PWA Installer -->
    <link rel="stylesheet" href="assets/css/pwa-installer.css">
    <script src="assets/js/pwa-installer.js"></script>

    <!-- Touch Gestures -->
    <link rel="stylesheet" href="assets/css/touch-gestures.css">
    <script src="assets/js/touch-gestures.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
